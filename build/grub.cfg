set timeout=0
set default=0

menuentry "PromptTTY @VERSION@" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 loglevel=4 systemd.unit=prompttty.target
    initrd /boot/prompttty.initramfs.gz
}

menuentry "PromptTTY @VERSION@ (serial console)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 loglevel=4 systemd.unit=prompttty.target prompttty.console=serial
    initrd /boot/prompttty.initramfs.gz
}
